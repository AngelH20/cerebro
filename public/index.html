<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1113">
  <title>HQ · Panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23f4b68c'/%3E%3Crect x='4' y='4' width='3' height='8' fill='%233b2314'/%3E%3Crect x='9' y='4' width='3' height='8' fill='%233b2314'/%3E%3Crect x='6' y='7' width='4' height='2' fill='%233b2314'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <canvas class="amb" id="amb-a" aria-hidden="true"></canvas>
  <canvas class="amb" id="amb-b" aria-hidden="true"></canvas>
  <div id="app">
    <header class="top">
      <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
      <div class="top-r">
        <a class="timer-pill" id="timer-pill" hidden title="Sesión de estudio en curso"></a>
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>
        <button class="btn" id="btn-diario">Diario de hoy</button>
        <button class="btn icon acc" id="btn-crear" title="Crear nota, tarea o carpeta" aria-label="Crear"></button>
        <button class="btn icon" id="btn-refresh" title="Actualizar" aria-label="Actualizar"></button>
        <a class="btn icon" id="btn-ajustes" href="#ajustes" title="Ajustes: portadas y fondo" aria-label="Ajustes"></a>
      </div>
    </header>
    <nav class="week" id="week" aria-label="Semana" hidden></nav>
    <main id="view"></main>
  </div>
  <nav class="dock" id="dock" aria-label="Secciones"></nav>
  <div class="drawer" id="drawer"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/scenes.js"></script>
  <script src="/app.js"></script>
</body>
</html>
